[project]
name = "data-analysis-portfolio"
version = "0.1.0"
description = "Data science and analytics portfolio projects"
license = { text = "MIT" }

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "N",   # naming
]
ignore = [
    "E402",   # Module level import not at top — required for matplotlib Agg backend + late scipy imports in scripts
    "E501",   # Line too long — notebook-generated code is exempt
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"

[tool.ruff.lint.per-file-ignores]
"*.ipynb" = ["E401", "E402", "E501", "F401", "F541", "F811", "I001", "N803"]
# ML convention: X_train / y_test uppercase names are idiomatic in sklearn code.
"wine-quality-classification/analysis.py" = ["E402", "E501", "N803", "N806"]
"pm25-air-quality-forecasting/analysis.py" = ["E402", "E501", "N803", "N806"]
"recommender-system-movielens/analysis.py" = ["E402", "E501", "N803", "N806"]
"tests/*.py" = ["N803", "N806"]

